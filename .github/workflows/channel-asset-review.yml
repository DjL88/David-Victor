name: Channel asset review

on:
  pull_request:
    paths:
      - scripts/review_channel_assets.py
      - .github/workflows/channel-asset-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Collect bounded public brand candidates (not production assets)
        run: python3 scripts/review_channel_assets.py
      - name: Upload source and asset candidates for human review
        uses: actions/upload-artifact@v4
        with:
          name: channel-asset-review
          path: channel-asset-review/
          retention-days: 3
          if-no-files-found: error
