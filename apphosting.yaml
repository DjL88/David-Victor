# Firebase App Hosting Configuration
# Section 5 & Published Runtime Requirements:
# APP_MODE=staging
# DELIVERECT_ENV=staging

env:
  - variable: APP_MODE
    value: staging
    availability:
      - RUNTIME
      - BUILD

  # This deployment currently serves the provisioned brand-alpha tenant on the
  # Firebase-managed *.hosted.app origin. Custom domains still resolve from the
  # verified domain registry; this value is only the managed-host default.
  - variable: PREVIEW_TENANT_ID
    value: brand-alpha
    availability:
      - RUNTIME

  - variable: DELIVERECT_ENV
    value: staging
    availability:
      - RUNTIME
      - BUILD

  # SEC-02a/02b: PLATFORM_SUPERADMIN_EMAILS is resolved from Secret Manager,
  # never committed here. After Identity Platform TOTP + App Check are enabled
  # for the Firebase project, set these runtime flags to "required":
  # ADMIN_MFA_ENFORCEMENT=required
  # APP_CHECK_ENFORCEMENT=required
  # and provide VITE_FIREBASE_APPCHECK_SITE_KEY at build time (the site key is
  # public configuration; do not place private reCAPTCHA credentials here).
