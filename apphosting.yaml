# Firebase App Hosting Configuration
# Section 5 & Published Runtime Requirements:
# APP_MODE=staging
# DELIVERECT_ENV=staging
# PLATFORM_SUPERADMIN_EMAILS=DLeitch22@gmail.com

env:
  - variable: APP_MODE
    value: staging
    availability:
      - RUNTIME
      - BUILD

  # This deployment currently serves the provisioned brand-alpha tenant on the
  # Firebase-managed *.hosted.app origin. Custom domains still resolve from the
  # verified domain registry; this value is only the managed-host default.
  - variable: PREVIEW_TENANT_ID
    value: brand-alpha
    availability:
      - RUNTIME

  - variable: DELIVERECT_ENV
    value: staging
    availability:
      - RUNTIME
      - BUILD

  - variable: PLATFORM_SUPERADMIN_EMAILS
    value: DLeitch22@gmail.com
    availability:
      - RUNTIME

  # Cloud Tasks worker security. These values are deployment configuration,
  # not application secrets. Keep their names aligned with cloudTasksSecurity.ts.
  - variable: CLOUD_TASKS_SA_EMAIL
    secret: cloud_tasks_sa_email
    availability:
      - RUNTIME

  - variable: CLOUD_TASKS_AUDIENCE
    secret: cloud_tasks_audience
    availability:
      - RUNTIME

  - variable: APP_URL
    secret: app_url
    availability:
      - RUNTIME
