# Firebase App Hosting Configuration
# Section 5 & Published Runtime Requirements:
# APP_MODE=staging
# DELIVERECT_ENV=staging
# PLATFORM_SUPERADMIN_EMAILS is resolved server-side from Secret Manager.

env:
  - variable: APP_MODE
    value: staging
    availability:
      - RUNTIME
      - BUILD

  # The managed staging origin is pinned to the provisioned Leitch Tech tenant.
  # Custom domains still resolve through the verified domain registry.
  - variable: PREVIEW_TENANT_ID
    value: 68517fde1c3ddaa7f6d0275c
    availability:
      - RUNTIME

  - variable: INTEGRATION_PROFILE_REQUIRED
    value: "true"
    availability:
      - RUNTIME

  # Keep the staging runtime pinned to the dedicated LT Firebase project. These
  # identifiers are public deployment configuration, not credentials.
  - variable: FIREBASE_PROJECT_ID
    value: leitch-tech-nonprod
    availability:
      - RUNTIME
      - BUILD

  - variable: FIREBASE_STORAGE_BUCKET
    value: leitch-tech-nonprod.firebasestorage.app
    availability:
      - RUNTIME
      - BUILD

  - variable: FIRESTORE_DATABASE_ID
    value: (default)
    availability:
      - RUNTIME

  - variable: DELIVERECT_ENV
    value: staging
    availability:
      - RUNTIME
      - BUILD

  # DV-07a: preserve the current staging Retail/Quest host explicitly.
  - variable: DELIVERECT_RETAIL_ORDER_BASE_URL
    value: https://api.staging.deliverect.io
    availability:
      - RUNTIME

  # SEC-02a/02b: the bootstrap SuperAdmin allowlist is deliberately not present
  # as plaintext runtime configuration. server/firebase.ts resolves the
  # PLATFORM_SUPERADMIN_EMAILS Secret Manager secret only for the break-glass
  # bootstrap path; normal admin authorization remains membership/claims based.
  #
  # MFA/App Check rollout remains intentionally explicit. After Firebase
  # Identity Platform TOTP and reCAPTCHA Enterprise App Check are provisioned,
  # enable these runtime flags rather than changing application code:
  #   ADMIN_REQUIRE_MFA=true
  #   ADMIN_REQUIRE_APP_CHECK=true
  #   CHECKOUT_REQUIRE_APP_CHECK=true
  # and provide VITE_FIREBASE_APPCHECK_SITE_KEY at BUILD time. The site key is
  # public web configuration; private reCAPTCHA credentials do not belong here.

  # Cloud Tasks remains disabled during the first non-production rollout. Add
  # CLOUD_TASKS_SA_EMAIL, CLOUD_TASKS_AUDIENCE and queue names only after the
  # dedicated service account, queues and final hosted origin are provisioned.

  # Non-production deployment guard. Tenant integration profiles cannot switch
  # this service to production endpoints or production secrets.
  - variable: ALLOWED_TENANT_ENVS
    value: staging
    availability:
      - RUNTIME
